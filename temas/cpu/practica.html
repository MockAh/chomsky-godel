<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Radiografía · Unidad de Control</title>
<style>
:root{--bg:#0a0e16;--pn:#0f1522;--pn2:#131b2a;--ln:#24304a;--tx:#dbe4f3;--mu:#8a98b3;--hi:#ffc94a;--ok:#3ee89a;--bad:#ff5d6c;--ac:#62b4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;height:100vh;height:100dvh}
#vp{position:relative;flex:1;min-width:0;overflow:hidden;touch-action:none}
#vp canvas{display:block}
#lbl{position:absolute;left:0;top:0;pointer-events:none}
#hud{position:absolute;left:12px;top:10px;pointer-events:none;max-width:calc(100% - 24px);z-index:2}
#hudI{font-weight:700;font-size:15px;color:var(--hi)}
#hudB{font:12px ui-monospace,Menlo,Consolas,monospace;margin-top:2px}
#hud .hint{font-size:11px;color:var(--mu);margin-top:4px}
#side{width:420px;display:flex;flex-direction:column;background:var(--pn);border-left:1px solid var(--ln);min-height:0}
#side header{padding:12px 14px 6px}
h1{font-size:15px;margin:0}
.sub{color:var(--mu);font-size:11.5px}
#ctl{padding:6px 14px 10px;border-bottom:1px solid var(--ln)}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:7px;padding:6px 8px;cursor:pointer}
button:hover{border-color:#3b4d72}
button.on{background:#2a2410;border-color:var(--hi);color:var(--hi)}
.ib b{display:block;font-size:13px}.ib span{font:10.5px ui-monospace,Menlo,monospace;color:var(--mu)}
.bits{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.bits button{padding:4px 0;font:13px ui-monospace,Menlo,monospace;text-align:center}
.bits button small{display:block;color:var(--mu);font-size:9.5px}
.bits button.one{background:#2b2208;border-color:#a8801f;color:var(--hi)}
#cur{margin-top:8px;font:12px ui-monospace,Menlo,monospace;color:var(--mu)}
#cur b{color:var(--tx)}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--ln)}
.tabs button{border-radius:7px 7px 0 0;border-bottom:0;background:transparent;flex:1;padding:6px 4px;color:var(--mu)}
.tabs button.on{background:var(--pn2);color:var(--hi);border-color:var(--ln)}
.scroll{flex:1;overflow:auto;min-height:0;padding:10px 14px 28px;background:var(--pn2)}
.tab{display:none}.tab.on{display:block}
h2{font-size:14px;margin:0 0 6px;color:var(--hi)}
h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin:12px 0 4px}
p{margin:4px 0}
.kv{font-size:12px;color:var(--mu)}.kv b{color:var(--tx);font-weight:600}
.f{font:12px/1.75 ui-monospace,Menlo,Consolas,monospace;background:#0b111c;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;overflow-x:auto}
.ov{text-decoration:overline}
.onv{color:var(--hi);font-weight:700}.offv{color:var(--mu);font-weight:700}
.mut{color:var(--mu);font-size:11.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
table{border-collapse:collapse;font:11px ui-monospace,Menlo,Consolas,monospace}
.tt td,.tt th{border:1px solid var(--ln);padding:2px 4px;text-align:center}
th.v{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;color:var(--mu);padding:4px 1px;white-space:nowrap}
.tt tr[data-m]{cursor:pointer}
.tt tr.act td{background:#2b2208;color:var(--hi)}
.tt td.one{color:#fff}.tt td.x{color:var(--mu)}
.ml{font:11.5px/1.7 ui-monospace,Menlo,monospace;overflow-x:auto}
.ml div{padding:1px 4px;border-radius:4px;white-space:nowrap}
.ml .act{background:#2b2208;color:var(--hi)}
.plawrap{overflow-x:auto}
.pla td,.pla th{padding:0;text-align:center}
.pla td.c{width:20px;height:22px;border:1px solid #1d2840;cursor:pointer}
.pla td.e{cursor:default}
.pla td.ok{color:var(--ok)}.pla td.bad{color:var(--bad)}
.pla td.hot{color:var(--hi);background:#2b2208}.pla td.cold{color:#56627a}
.pla td.sep,.pla th.sep{width:8px;border:0}
.pla tr.act th{color:var(--hi)}
.pla tbody th{padding:0 6px 0 0;font-weight:500;text-align:right;white-space:nowrap}
.pla td.note{font-size:10px;color:var(--mu);text-align:left;padding-left:4px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.lrow .ln{font-size:12px}
.seg{display:flex}
.seg button{border-radius:0;padding:4px 7px;font-size:11.5px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
input[type=range]{width:100%;accent-color:var(--hi)}
label.ck{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11.5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.back{font-size:11.5px;padding:3px 8px;margin-bottom:8px}
.lbl{font:10px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#cfe0ff;background:rgba(8,12,20,.75);border:1px solid rgba(120,150,200,.28);padding:1px 4px;border-radius:3px;white-space:nowrap}
.lbl.hot{color:var(--hi);border-color:var(--hi)}
.lbl.big{font:600 11px system-ui,sans-serif;color:#e8d3a0;letter-spacing:.08em}
.lbl.ttl,.lbl.rot{background:none;border:0;padding:0}
.lbl.ttl .in{display:inline-block;transform:translateX(50%);font:600 12px system-ui,sans-serif;color:var(--hi);background:rgba(8,12,20,.82);border:1px solid rgba(255,201,74,.45);padding:2px 6px;border-radius:4px}
.lbl.rot .r{display:inline-block;transform:rotate(-55deg);background:rgba(8,12,20,.75);border:1px solid rgba(120,150,200,.28);padding:1px 4px;border-radius:3px}
.lbl.rot.hot .r{color:var(--hi);border-color:var(--hi)}
@media (max-width:860px){
 #app{flex-direction:column}
 #vp{flex:none;height:50vh;height:50dvh}
 #side{width:auto;flex:1;border-left:0;border-top:1px solid var(--ln)}
 #side header{display:none}
 .lbl{font-size:9px}
}
</style>

<body>
<div id="app">
 <div id="vp">
  <div id="hud"><div id="hudI"></div><div id="hudB"></div><div class="hint">Arrastra: orbitar · rueda/pellizco: zoom · toca: inspeccionar · toca un bit del IR: conmutarlo</div></div>
 </div>
 <aside id="side">
  <header><h1>Radiografía de la Unidad de Control</h1><div class="sub">MIPS monociclo · PLA de dos niveles · pseudo-NMOS</div></header>
  <div id="ctl"><div class="btns" id="ib"></div><div class="bits" id="bits"></div><div id="cur"></div></div>
  <nav class="tabs"><button data-t="insp" class="on">Inspección</button><button data-t="tt">Verdad</button><button data-t="pla">PLA</button><button data-t="cap">Capas</button></nav>
  <div class="scroll" id="scroll">
   <section class="tab on" id="tab-insp"></section>
   <section class="tab" id="tab-tt"></section>
   <section class="tab" id="tab-pla"></section>
   <section class="tab" id="tab-cap"></section>
  </div>
 </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= MODELO LÓGICO ================= */
const INSTR=[
 {id:'R',  name:'R-format',ex:'add/sub/and/or/slt',op:[0,0,0,0,0,0]},
 {id:'lw', name:'lw',      ex:'lw $rt, off($rs)', op:[1,0,0,0,1,1]},
 {id:'sw', name:'sw',      ex:'sw $rt, off($rs)', op:[1,0,1,0,1,1]},
 {id:'beq',name:'beq',     ex:'beq $rs, $rt, off',op:[0,0,0,1,0,0]}];
const SIGNALS=[
 {id:'RegDst',  terms:['R'],      desc:'Elige rd (IR[15:11]) en vez de rt (IR[20:16]) como registro destino.'},
 {id:'ALUSrc',  terms:['lw','sw'],desc:'Segundo operando de la ALU = inmediato con signo extendido, no el registro rt.'},
 {id:'MemtoReg',terms:['lw'],     desc:'El valor escrito en el banco de registros viene de la memoria de datos, no de la ALU.'},
 {id:'RegWrite',terms:['R','lw'], desc:'Habilita la escritura en el banco de registros.'},
 {id:'MemRead', terms:['lw'],     desc:'Habilita la lectura de la memoria de datos.'},
 {id:'MemWrite',terms:['sw'],     desc:'Habilita la escritura en la memoria de datos.'},
 {id:'Branch',  terms:['beq'],    desc:'Junto con el flag Zero de la ALU selecciona PC ← PC+4+(off≪2).'},
 {id:'ALUOp1',  terms:['R'],      desc:'ALUOp=10: el control de ALU debe decodificar el campo funct.'},
 {id:'ALUOp0',  terms:['beq'],    desc:'ALUOp=01: la ALU resta (comparación para beq).'}];
const XC={sw:['RegDst','MemtoReg'],beq:['RegDst','MemtoReg']};
const iOf=id=>INSTR.findIndex(I=>I.id===id);
function compute(bits){
 const lit=[];for(let i=0;i<6;i++){lit[2*i]=bits[i];lit[2*i+1]=1-bits[i];}
 const m=INSTR.map(I=>I.op.every((b,i)=>b===bits[i])?1:0);
 const sig=SIGNALS.map(s=>s.terms.some(t=>m[iOf(t)])?1:0);
 return {bits:[...bits],lit,m,sig,instr:m.indexOf(1)};
}
let S=compute(INSTR[1].op);

/* ================= GEOMETRÍA COMÚN (alineada entre capas) ================= */
const SX=0.8;
const litX=k=>-10+k*SX;               // 12 columnas: Op5,¬Op5,…,Op0,¬Op0
const litK=(i,neg)=>2*i+(neg?1:0);
const pairX=i=>litX(2*i)+SX/2;
const rowZ=m=>-2.4+m*1.6;             // 4 renglones de producto
const outX=j=>1+j;                    // 9 columnas de salida
const AND_X0=-10.6,AND_X1=-0.6,OR_X0=0.3,OR_X1=9.6;
const HI=0xffc94a;

/* ================= ESCENA ================= */
const $=s=>document.querySelector(s);
const vp=$('#vp');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
vp.appendChild(renderer.domElement);
const lr=new CSS2DRenderer();lr.domElement.id='lbl';vp.appendChild(lr.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e16);
scene.fog=new THREE.Fog(0x0a0e16,70,140);
const camera=new THREE.PerspectiveCamera(42,1,0.1,400);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.autoRotateSpeed=0.6;
scene.add(new THREE.HemisphereLight(0xbcd3ff,0x1a1020,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(10,40,18);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x88aaff,0.6);dl2.position.set(-25,12,-12);scene.add(dl2);

const LAY={
 4:{name:'Capa 4 · Bloque funcional y decodificador',short:'Bloque / decodificador'},
 3:{name:'Capa 3 · Lógica combinacional (PLA)',short:'PLA (álgebra)'},
 2:{name:'Capa 2 · Transistores pseudo-NMOS',short:'Transistores'},
 1:{name:'Capa 1 · Silicio y layout VLSI',short:'Silicio / layout'}};
for(const n of [1,2,3,4]){const g=new THREE.Group();scene.add(g);LAY[n].g=g;LAY[n].mode='visible';}
let gap=4.5,gapCur=4.5;

/* ================= HELPERS ================= */
function mat(c,o={}){const op=o.op??1;return new THREE.MeshStandardMaterial({color:c,metalness:o.m??0.35,roughness:o.r??0.5,transparent:op<1,opacity:op,depthWrite:op>=1,emissive:o.e??0x000000,emissiveIntensity:o.ei??1});}
function mesh(geo,p,x,y,z,c,o={}){const me=new THREE.Mesh(geo,mat(c,o));me.position.set(x,y,z);me.userData.c0=c;me.userData.e0=o.e??0;me.userData.ei0=o.ei??1;p.add(me);return me;}
const B=(p,w,h,d,x,y,z,c,o)=>mesh(new THREE.BoxGeometry(w,h,d),p,x,y,z,c,o);
const WX=(p,x0,x1,y,z,t,c,o)=>B(p,Math.abs(x1-x0),t,t,(x0+x1)/2,y,z,c,o);
const WZ=(p,x,y,z0,z1,t,c,o)=>B(p,t,t,Math.abs(z1-z0),x,y,(z0+z1)/2,c,o);
const SP=(p,r,x,y,z,c,o)=>mesh(new THREE.SphereGeometry(r,16,12),p,x,y,z,c,o);
const CY=(p,r,h,x,y,z,c,o)=>mesh(new THREE.CylinderGeometry(r,r,h,12),p,x,y,z,c,o);
function CONE(p,x,y,z,c,r=0.16,h=0.36){const me=mesh(new THREE.ConeGeometry(r,h,14),p,x,y,z,c);me.rotation.x=Math.PI/2;return me;}
const PID={};
function tag(o,pid){o.userData.pid=pid;if(!PID[pid])PID[pid]=o;return o;}
function lvl(me,on,hi=HI,ei=1.1){const m=me.material;if(on){m.color.set(hi);m.emissive.set(hi);m.emissiveIntensity=ei;}else{m.color.set(me.userData.c0);m.emissive.set(me.userData.e0);m.emissiveIntensity=me.userData.ei0;}}
function setC(me,c,ei){me.material.color.set(c);me.material.emissive.set(c);me.material.emissiveIntensity=ei;}
const LBL=[];let showLabels=!matchMedia('(max-width:860px)').matches;
function L(n,p,html,x,y,z,cls=''){const d=document.createElement('div');d.className='lbl '+cls;const t=cls.includes('ttl');d.innerHTML=t?`<span class="in">${html}</span>`:html;const o=new CSS2DObject(d);o.position.set(x,y,z);p.add(o);LBL.push({o,n,ttl:t});return d;}
const UPD=[];function U(stage,fn){UPD.push({stage,fn,g:-1});}

/* transistor estilizado: cuerpo (canal) + compuerta (+ burbuja si pMOS) */
function makeT(p,x,y,z,kind,along,sc=1){
 const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(sc);p.add(g);
 const body=B(g,0.3,0.12,0.3,0,0,0,kind==='n'?0x27324a:0x4a3424,{m:.3,r:.6});
 const gate=along==='z'?B(g,0.1,0.05,0.44,0,0.09,0,0x5a2632,{m:.4,r:.5}):B(g,0.44,0.05,0.1,0,0.09,0,0x5a2632,{m:.4,r:.5});
 if(kind==='p')SP(g,0.05,0,0.14,0,0xe0e0e0);
 return {g,body,gate};
}
function tSt(t,on,gate,weak=false){
 const m=t.body.material;
 if(on){const c=weak?0x8a5212:0xff7a1a;m.color.set(c);m.emissive.set(c);m.emissiveIntensity=weak?0.45:1.3;}
 else{m.color.set(t.body.userData.c0);m.emissive.set(0);m.emissiveIntensity=0;}
 lvl(t.gate,gate,0xff4d5a,0.9);
}

/* ================= CAPA 4 · BLOQUE ================= */
function buildL4(){
 const G=LAY[4].g,n=4;
 L(n,G,LAY[4].name,-11.4,0.35,4.8,'ttl');
 const cu=tag(B(G,21.4,0.7,8.4,-0.6,0.35,0,0x182338,{m:.85,r:.25,op:.42}),'L4:cu');
 cu.add(new THREE.LineSegments(new THREE.EdgesGeometry(cu.geometry),new THREE.LineBasicMaterial({color:0xd6a84e,transparent:true,opacity:.9})));
 L(n,G,'UNIDAD DE CONTROL · decodificador principal',-0.6,0.9,0,'big');
 for(let i=0;i<6;i++){
  const c=tag(B(G,0.7,0.4,0.9,pairX(i),0.3,-7.2,0x3a3320,{m:.6,r:.35}),'L4:ir:'+i);
  const w=tag(WZ(G,pairX(i),0.3,-6.75,-4.45,0.07,0x5c4c22),'L4:pin:'+i);
  const pin=tag(B(G,0.34,0.34,0.4,pairX(i),0.35,-4.25,0x9b7a2a,{m:.9,r:.3}),'L4:pin:'+i);
  const lb=L(n,G,'',pairX(i),0.95,-7.2);
  U(0,s=>{const b=s.bits[i];lvl(c,b,HI,1.0);lvl(w,b);lvl(pin,b);lb.innerHTML=`Op${5-i}=${b}`;lb.classList.toggle('hot',!!b);});
 }
 tag(B(G,10.2,0.4,0.9,4.7,0.3,-7.2,0x2a3142,{m:.5,r:.5}),'L4:irrest');
 L(n,G,'IR[25:0] · rs | rt | rd | shamt | funct',4.7,0.85,-7.2);
 L(n,G,'IR[31:26] · opcode',pairX(2)+0.4,0.3,-8.05);
 SIGNALS.forEach((s,j)=>{
  const x=outX(j);
  const pin=tag(B(G,0.34,0.34,0.4,x,0.35,4.25,0x9b7a2a,{m:.9,r:.3}),'L4:out:'+j);
  const w=tag(WZ(G,x,0.35,4.45,6.2,0.07,0x5c4c22),'L4:out:'+j);
  const cn=tag(CONE(G,x,0.35,6.35,0x5c4c22,0.15,0.35),'L4:out:'+j);
  const lb=L(n,G,'',x,0.35,7.05,'rot');
  U(5,st=>{const v=st.sig[j];lvl(pin,v);lvl(w,v);lvl(cn,v);lb.innerHTML=`<span class="r">${s.id}=${v}</span>`;lb.classList.toggle('hot',!!v);});
 });
 L(n,G,'bus de control → datapath',-0.9,0.35,6.3);
}

/* ================= CAPA 3 · PLA ================= */
function buildL3(){
 const G=LAY[3].g,n=3;
 L(n,G,LAY[3].name,-11.4,0.1,4.8,'ttl');
 tag(B(G,AND_X1-AND_X0,0.04,7.4,(AND_X0+AND_X1)/2,-0.03,-0.35,0x12385c,{op:.5,m:.2,r:.7}),'L3:andplane');
 tag(B(G,OR_X1-OR_X0,0.04,7.4,(OR_X0+OR_X1)/2,-0.03,-0.35,0x3a1660,{op:.5,m:.2,r:.7}),'L3:orplane');
 L(n,G,'PLANO AND · minitérminos',(AND_X0+AND_X1)/2,0.05,-3.45);
 L(n,G,'PLANO OR · suma de productos',(OR_X0+OR_X1)/2,0.05,-3.7);
 for(let i=0;i<6;i++){
  const xa=litX(2*i),xb=litX(2*i+1),xp=pairX(i),pid='L3:drv:'+i,c0=0x5c4c22;
  const st=tag(WZ(G,xp,0.12,-5.6,-5.0,0.06,c0),pid);
  const sp=tag(WX(G,xa,xb,0.12,-5.0,0.06,c0),pid);
  const s1=tag(WZ(G,xa,0.12,-5.0,-4.78,0.06,c0),pid);
  const s2=tag(WZ(G,xb,0.12,-5.0,-4.78,0.06,c0),pid);
  const cb=tag(CONE(G,xa,0.12,-4.6,c0),pid);
  const ci=tag(CONE(G,xb,0.12,-4.6,c0),pid);
  const bub=tag(SP(G,0.06,xb,0.12,-4.36,0xbbbbbb),pid);
  L(n,G,`Op${5-i}`,xp,0.12,-5.9);
  U(1,s=>{const b=s.bits[i];[st,sp,s1,s2,cb].forEach(o=>lvl(o,b));lvl(ci,1-b);lvl(bub,1-b);});
 }
 for(let k=0;k<12;k++){
  const i=k>>1,neg=k&1;
  const w=tag(WZ(G,litX(k),0.12,-4.3,3.3,0.06,neg?0x6a3f8f:0x2f6f9f),'L3:lit:'+k);
  const lb=L(n,G,`<span class="r">${neg?'¬':''}Op${5-i}</span>`,litX(k),0.12,3.75,'rot');
  U(1,s=>{lvl(w,s.lit[k]);lb.classList.toggle('hot',!!s.lit[k]);});
 }
 INSTR.forEach((I,m)=>{
  const z=rowZ(m);
  const w=tag(WX(G,AND_X0+0.2,OR_X1-0.2,0.12,z,0.08,0x35506e),'L3:prod:'+m);
  const lb=L(n,G,`M<sub>${I.id}</sub>`,AND_X0-0.4,0.12,z);
  U(3,s=>{lvl(w,s.m[m]);lb.classList.toggle('hot',!!s.m[m]);});
  I.op.forEach((b,i)=>{
   const k=litK(i,b===0);
   const nd=tag(SP(G,0.13,litX(k),0.13,z,0x5a606c,{m:.3,r:.4}),`L3:and:${m}:${i}`);
   U(2,s=>{if(s.m[m])setC(nd,HI,1.4);else if(s.lit[k])setC(nd,0x2fd07f,0.55);else setC(nd,0xd03a4c,0.6);});
  });
 });
 SIGNALS.forEach((s,j)=>{
  const x=outX(j);

const ray=new THREE.Raycaster();ray.params.Line.threshold=0.05;
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
 if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(dx*dx+dy*dy>49)return;
 const r=renderer.domElement.getBoundingClientRect();
 const groups=[1,2,3,4].filter(n=>LAY[n].mode==='visible').map(n=>LAY[n].g);
 if(!groups.length)return;
 const hitAt=(px,py)=>{
  ray.setFromCamera(new THREE.Vector2(((px-r.left)/r.width)*2-1,-((py-r.top)/r.height)*2+1),camera);
  for(const h of ray.intersectObjects(groups,true)){let o=h.object;while(o&&!o.userData.pid)o=o.parent;if(o)return o;}
  return null;
 };
 // tolerancia: las pistas son finas; si el centro cae en un fondo, probar un anillo de ±7 px
 const BG=/^(L1:sub|L1:nwell|L3:andplane|L3:orplane|L4:cu)$/;
 let o=hitAt(e.clientX,e.clientY);
 if(!o||BG.test(o.userData.pid)){
  for(const rad of [3,5,7]){let f=null;
   for(let a=0;a<8&&!f;a++){const c=hitAt(e.clientX+rad*Math.cos(a*Math.PI/4),e.clientY+rad*Math.sin(a*Math.PI/4));if(c&&!BG.test(c.userData.pid))f=c;}
   if(f){o=f;break;}}
 }
 if(!o)return;
 const pid=o.userData.pid;
 if(pid.startsWith('L4:ir:')){const i=+pid.split(':')[2];const nb=[...S.bits];nb[i]^=1;setBits(nb);}

function LTGEN(){return `<p>Sea Φ el lenguaje proposicional sobre p<sub>5</sub>…p<sub>0</sub> (≙ Op<sub>5</sub>…Op<sub>0</sub>) y φ ~ ψ ⇔ ⊢ φ ↔ ψ. El cociente ${LT6} = Φ/~ es el álgebra de Lindenbaum–Tarski: el álgebra de Boole libre en 6 generadores, ${LT6} ≅ 𝒫({0,1}<sup>6</sup>), con 2<sup>64</sup> elementos y 2<sup>6</sup> = 64 átomos —los minitérminos— (el 𝓑<sub>2<sup>6</sup></sub>: retículo atómico con 2<sup>6</sup> átomos).</p>
<p>El opcode es una valuación v ∈ {0,1}<sup>6</sup>. Por dualidad de Stone: v ↔ átomo a<sub>v</sub> = [M<sub>v</sub>] ↔ ultrafiltro U<sub>v</sub> = ↑a<sub>v</sub> ↔ homomorfismo h<sub>v</sub>: ${LT6} → 2. Cada señal es una clase [φ<sub>S</sub>] = ⋁{átomos ≤ [φ<sub>S</sub>]} (su FND canónica) y la UC computa h<sub>v</sub>([φ<sub>S</sub>]) = 1 ⇔ a<sub>v</sub> ≤ [φ<sub>S</sub>] para las 9 señales.</p>
<p class="mut">Precisión: lo homomórfico es la evaluación h<sub>v</sub> sobre ${LT6}. El mapa C: {0,1}<sup>6</sup> → {0,1}<sup>9</sup>, C(v) = (h<sub>v</sub>[φ<sub>S</sub>])<sub>S</sub>, es sólo una función: no preserva ∧ ni ∨.</p>`;}

}

 case 'L4:pin':return {title:`Pin de entrada · Op<sub>${5-a}</sub>`,nivel,

 case 'L4:out':return outInfo(a,nivel,true);
 case 'L3:out':return outInfo(a,nivel,false);
 case 'L3:andplane':return {title:'Plano AND (generación de minitérminos)',nivel,
  formula:INSTR.map((I,m)=>`${Mn(m)} = ${mint(m)}`).join('<br>'),
  lt:`Implementa v ↦ (h<sub>v</sub>[M<sub>m</sub>])<sub>m</sub>: cada renglón es un átomo de ${LT6} (un singleton de {0,1}<sup>6</sup>). Sólo 4 de los 64 átomos están cableados; para cualquier otra v todos dan 0 (salida one-hot o nula).<br><br>Minimización = elegir un representante más corto en el cociente ${LT6}/↓[¬δ], con δ = ⋁ de los 4 átomos (≅ 𝒫(D), |D| = 4). Ahí [M<sub>lw</sub>] = [Op<sub>5</sub>·<span class="ov">Op<sub>3</sub></span>], [M<sub>sw</sub>] = [Op<sub>5</sub>·Op<sub>3</sub>], [M<sub>beq</sub>] = [Op<sub>2</sub>], [M<sub>R</sub>] = [<span class="ov">Op<sub>5</sub></span>·<span class="ov">Op<sub>2</sub></span>]. Este PLA usa la forma canónica (6 literales).`,
  fis:'12 columnas (cada Op<sub>k</sub> en ambas polaridades) × 4 renglones; 24 cruces programados. En capa 2 es un arreglo NOR pseudo-NMOS: AND(ℓ) = NOR(¬ℓ).',
  estado:S.instr>=0?`Renglón activo: ${Mn(S.instr)}`:'Ningún renglón activo (opcode no implementado).'};
 case 'L3:orplane':return {title:'Plano OR (suma de productos)',nivel,
  formula:SIGNALS.map((s,j)=>`${s.id} = ${sop(j)}`).join('<br>'),

  fis:'4 renglones × 9 columnas; 11 cruces programados. En capa 2: NOR pseudo-NMOS seguido de inversor = OR.',
  estado:`C(v) = ${vec()}`};
 case 'L3:drv':return {title:`Driver de entrada · Op<sub>${5-a}</sub> / <span class="ov">Op<sub>${5-a}</sub></span>`,nivel,
  formula:`Op<sub>${5-a}</sub> = ${S.bits[a]} ; <span class="ov">Op<sub>${5-a}</sub></span> = ${1-S.bits[a]}`,
  lt:`Produce el generador y su complemento, [p] y ¬[p]. Todo homomorfismo de álgebras de Boole preserva el complemento: h<sub>v</sub>(¬[p]) = 1 − h<sub>v</sub>([p]).`,
  fis:'Buffer + inversor CMOS: cada bit entra al PLA en ambas polaridades (2n columnas) y se reamplifica porque cada columna es una carga capacitiva larga.',estado:vH()};
 case 'L3:lit':{const i=a>>1,neg=a&1;const users=INSTR.map((I,m)=>(I.op[i]===0)===(neg===1)?Mn(m):null).filter(Boolean);

  fis:`Recorre el plano AND. En capa 2 la columna física homóloga alimenta las compuertas de los minitérminos que usan el literal opuesto.`,

 case 'L3:prod':return {title:`Línea de producto ${Mn(a)} (${INSTR[a].name})`,nivel,
  formula:`${Mn(a)} = ${mint(a)}<br>= ${evalM(a)} = ${S.m[a]}`,

  fis:'Atraviesa ambos planos: en AND es la salida (nodo NOR), en OR es la entrada (compuerta de los transistores de las columnas).',

 case 'L3:and':{const I=INSTR[a],neg=I.op[b]===0,k=litK(b,neg),l=lit(b,neg),v=S.lit[k];
  return {title:`Nodo AND · ${Mn(a)} ∩ ${l}`,nivel,
  formula:`${Mn(a)} = ${mint(a)}<br>ℓ = ${l} = ${v}`,

  fis:`En capa 2 se realiza con un nMOS sobre la columna complementaria ${lit(b,!neg)}: conduce exactamente cuando ${l} = 0 y descarga P<sub>${I.id}</sub>.`,
  estado:`${l} = ${hv(v)} → ${v?'literal satisfecho':'este literal anula '+Mn(a)} · ${Mn(a)} = ${hv(S.m[a])}`};}
 case 'L3:or':{const s=SIGNALS[b];return {title:`Nodo OR · ${Mn(a)} → ${s.id}`,nivel,

 case 'L2:tand':{const I=INSTR[a],l=lit(b,I.op[b]===0),lc=lit(b,I.op[b]===1),kp=litK(b,I.op[b]===1),g=S.lit[kp];
  return {title:`nMOS pull-down · ${Mn(a)}, columna ${lc}`,nivel,
  formula:`P<sub>${I.id}</sub> = ¬(${mintC(a)})<br>= ${mint(a)}   [De Morgan]`,

  fis:`Drenaje en P<sub>${I.id}</sub>, fuente en GND, compuerta en la columna ${lc}. Conduce ⇔ ${lc} = 1 ⇔ ${l} = 0; entonces vence al pull-up débil y P cae a ≈ 0 V. Si los 6 están cortados, P queda en V<sub>DD</sub>: NOR(¬ℓ…) = AND(ℓ…).`,
  estado:`V<sub>G</sub> ${V(g)} → ${g?'<span class="onv">canal formado · CONDUCE</span>':'cortado'} · P<sub>${I.id}</sub> ${V(S.m[a])}`};}
 case 'L2:tor':{const s=SIGNALS[b],I=INSTR[a];return {title:`nMOS · columna ${s.id} ← P<sub>${I.id}</sub>`,nivel,

  fis:`Compuerta = P<sub>${I.id}</sub> (en este plano la línea de producto es compuerta), drenaje en la columna C<sub>${s.id}</sub>, fuente a GND. Conduce ⇔ ${Mn(a)} = 1.`,
  estado:`V<sub>G</sub> ${V(S.m[a])} → ${S.m[a]?'<span class="onv">CONDUCE</span>':'cortado'} · C<sub>${s.id}</sub> ${V(!S.sig[b])}`};}
 case 'L2:pu':return {title:`Pull-up pMOS · P<sub>${INSTR[a].id}</sub>`,nivel,

  estado:`P<sub>${INSTR[a].id}</sub> ${V(S.m[a])}${S.m[a]?'':' (consumo estático activo)'}`};
 case 'L2:puc':{const s=SIGNALS[a];return {title:`Pull-up pMOS · columna ${s.id}`,nivel,

  fis:'pMOS débil siempre encendido; precarga la columna (metal 2) a V<sub>DD</sub>.',

 case 'L2:iinv':{const v=S.bits[a];return {title:`Inversor de entrada · <span class="ov">Op<sub>${5-a}</sub></span>`,nivel,

 case 'L2:gl':{const i=a>>1,neg=a&1;const gated=INSTR.map((I,m)=>(I.op[i]===1)===(neg===1)?Mn(m):null).filter(Boolean);
  return {title:`Línea de compuerta · ${litK2(a)}`,nivel,
  formula:`${litK2(a)} = ${S.lit[a]}<br>compuertas de: ${gated.join(', ')||'—'}`,

  fis:'Poly/metal con capacitancia = Σ C<sub>gate</sub> → retardo RC; de ahí el driver de entrada.',

 case 'L2:prod':return {title:`Nodo de producto P<sub>${INSTR[a].id}</sub>`,nivel,

 case 'L2:col':{const s=SIGNALS[a];return {title:`Columna OR (pre-inversor) · ${s.id}`,nivel,

 case 'L2:gnd':return {title:'Riel GND',nivel,formula:'0 ≡ ⊥',lt:'El ínfimo ⊥ del álgebra: todo pull-down es un camino a ⊥.',fis:'Riel de tierra (0 V); destino de la carga de las líneas descargadas.'};
 case 'L2:vdd':return {title:'Riel V<sub>DD</sub>',nivel,formula:'1 ≡ ⊤',lt:'El supremo ⊤: fuente del estado por defecto de cada línea.',fis:'Alimentación (≈ 1 V en nodos modernos); alimenta los pull-ups pMOS.'};
 case 'L1:sub':return {title:'Sustrato p-Si',nivel,formula:'—',lt:'El soporte común, a GND (⊥): todo canal nMOS descarga hacia él.',fis:'Oblea de silicio tipo p ligeramente dopada. Sobre ella se definen difusiones, pozos, poly y metales por fotolitografía.'};
 case 'L1:nwell':return {title:'Pozo n (n-well)',nivel,formula:'—',lt:'Región donde la polaridad se invierte: aloja los transistores que realizan ⊤ y los complementos CMOS.',fis:'Región dopada n, polarizada a V<sub>DD</sub>, que alberga los pMOS (pull-ups, mitades p de los inversores).'};
 case 'L1:pdiff':return {title:'Difusión p+ / n+ (pull-ups e inversores)',nivel,formula:'—',lt:'Soporte físico de ⊤ (pull-ups) y de ¬ (inversores).',fis:'Fuente/drenaje de los pMOS dentro del n-well (ámbar) y de los nMOS de inversores (verde).'};
 case 'L1:diffA':{const I=INSTR[a],kp=litK(b,I.op[b]===1),lc=lit(b,I.op[b]===1),g=S.lit[kp];
  return {title:`Difusión n+ · transistor de ${Mn(a)} bajo ${lc}`,nivel,

  fis:'Difusión n+ en sustrato p (fuente y drenaje). Donde el poly la cruza se forma el canal: con el poly a V<sub>DD</sub> se induce una capa de inversión de electrones que une ambas regiones n+. Contacto izquierdo → metal 1 de producto; derecho → riel GND.',
  estado:`poly ${V(g)} → ${g?'<span class="onv">capa de inversión · conduce</span>':'sin canal'}`};}
 case 'L1:diffO':{const s=SIGNALS[b];return {title:`Difusión n+ · cruce ${Mn(a)} × ${s.id}`,nivel,
  formula:`canal ⇔ ${Mn(a)} = 1`,
  lt:`Grabado físico de a<sub>${INSTR[a].id}</sub> ≤ [φ<sub>${s.id}</sub>].`,
  fis:'El poly de producto la cruza; drenaje → contacto → metal 1 → vía → metal 2 (columna); fuente → metal 1 → GND.',

 case 'L1:polyA':return {title:`Polisilicio · columna ${litK2(a)}`,nivel,
  formula:`${litK2(a)} = ${S.lit[a]}`,

  fis:'Polisilicio dopado; donde cruza difusión activa es la compuerta autoalineada de un transistor.',estado:V(S.lit[a])};
 case 'L1:polyO':return {title:`Polisilicio · producto ${Mn(a)} (plano OR)`,nivel,
  formula:`${Mn(a)} = ${S.m[a]}`,lt:'El átomo como compuerta: su tira toca las columnas de las señales que lo contienen.',

 case 'L1:m1':return {title:'Metal 1 · rieles y puentes',nivel,formula:'—',lt:'Conectividad: no aporta lógica, sólo identifica nodos (la relación de equivalencia eléctrica).',fis:'Rieles V<sub>DD</sub>/GND, puentes de fuente y pads de drenaje.'};
 case 'L1:m2':{const s=SIGNALS[a];return {title:`Metal 2 · columna ${s.id}`,nivel,

 case 'L1:ct':return {title:'Contacto',nivel,formula:'—',lt:'Identifica dos nodos físicos como uno solo.',fis:'Tapón de tungsteno que une difusión con metal 1.'};
 case 'L1:ctp':return {title:'Contacto metal 1 → poly',nivel,formula:'—',lt:'El punto donde el átomo cambia de rol: de salida (AND) a entrada (OR).',fis:'Une la línea de producto en metal 1 con su prolongación en polisilicio.'};
 case 'L1:via':return {title:'Vía metal 1 → metal 2',nivel,formula:'—',lt:'Marca de pertenencia átomo ∈ columna.',fis:'Conexión vertical entre niveles de metal.'};
 }
 return {title:pid,nivel,formula:'—',lt:'—',fis:'—'};
}
function overview(){return {title:'Vista general',nivel:'Todas las capas',
 formula:SIGNALS.map((s,j)=>`${s.id} = ${sop(j)} = ${S.sig[j]}`).join('<br>'),

 fis:'Capa 4: el bloque recibe Op[5:0] del IR. Capa 3: el PLA genera 4 minitérminos y 9 sumas. Capa 2: cada plano es un NOR pseudo-NMOS (pull-ups débiles + pull-downs en paralelo) y las salidas pasan por inversores. Capa 1: cada transistor es un cruce poly × difusión; metal 1/2 unen los nodos. Toca cualquier pieza para su ficha.',
 estado:vH()};}
function card(o){return `${selPid?'<button class="back" id="back">← vista general</button>':''}<h2>${o.title}</h2><div class="kv">Nivel de abstracción: <b>${o.nivel}</b></div><h3>Fórmula booleana</h3><div class="f">${o.formula}</div><h3>Vínculo Lindenbaum–Tarski</h3>${o.lt.trim().startsWith('<p')?o.lt:'<p>'+o.lt+'</p>'}<h3>Realización física</h3><p>${o.fis}</p>${o.estado?`<h3>Estado actual</h3><p>${o.estado}</p>`:''}`;}
function renderInsp(){const el=$('#tab-insp');el.innerHTML=card(selPid?info(selPid):overview());const bk=el.querySelector('#back');if(bk)bk.onclick=()=>{selPid=null;selObj=null;selBox.visible=false;renderInsp();};}

/* ================= TABLA DE VERDAD / PLA ================= */
function renderTT(){
 let h='<div class="plawrap"><table class="tt"><thead><tr><th>Instr</th>'+['Op5','Op4','Op3','Op2','Op1','Op0'].map(b=>`<th class="v">${b}</th>`).join('')+SIGNALS.map(s=>`<th class="v">${s.id}</th>`).join('')+'</tr></thead><tbody>';
 INSTR.forEach((I,m)=>{h+=`<tr class="${S.m[m]?'act':''}" data-m="${m}"><td>${I.name}</td>${I.op.map(b=>`<td>${b}</td>`).join('')}${SIGNALS.map(s=>{const x=(XC[I.id]||[]).includes(s.id),v=s.terms.includes(I.id)?1:0;return `<td class="${x?'x':v?'one':''}">${x?'X':v}</td>`;}).join('')}</tr>`;});
 if(S.instr<0)h+=`<tr class="act"><td>otro</td>${S.bits.map(b=>`<td>${b}</td>`).join('')}${SIGNALS.map(()=>'<td>0</td>').join('')}</tr>`;
 h+='</tbody></table></div><p class="mut">X = no-care; el PLA canónico lo realiza como 0. Toca una fila para cargar esa instrucción.</p>';
 h+=`<h3>Minitérminos bajo v = ${S.bits.join('')}</h3><div class="ml">`+INSTR.map((I,m)=>`<div class="${S.m[m]?'act':''}">${Mn(m)} = ${mint(m)} = ${evalM(m)} = ${S.m[m]}</div>`).join('')+'</div>';
 h+='<h3>Señales (suma de productos)</h3><div class="ml">'+SIGNALS.map((s,j)=>`<div class="${S.sig[j]?'act':''}">${s.id} = ${sop(j)} = ${s.terms.map(t=>S.m[iOf(t)]).join(' + ')} = ${S.sig[j]}</div>`).join('')+'</div>';
 const el=$('#tab-tt');el.innerHTML=h;
 el.querySelectorAll('tr[data-m]').forEach(tr=>tr.onclick=()=>setBits(INSTR[+tr.dataset.m].op));
}
function renderPLA(){
 let h='<div class="plawrap"><table class="pla"><thead><tr><th></th>';
 for(let k=0;k<12;k++)h+=`<th class="v">${k&1?'¬':''}Op${5-(k>>1)}</th>`;
 h+='<th class="sep"></th>'+SIGNALS.map(s=>`<th class="v">${s.id}</th>`).join('')+'</tr></thead><tbody>';
 INSTR.forEach((I,m)=>{
  h+=`<tr class="${S.m[m]?'act':''}"><th>${Mn(m)}</th>`;
  for(let k=0;k<12;k++){const i=k>>1,neg=k&1;
   if((I.op[i]===0)===(neg===1))h+=`<td class="c ${S.m[m]?'hot':S.lit[k]?'ok':'bad'}" data-pid="L3:and:${m}:${i}">●</td>`;else h+='<td class="c e"></td>';}
  h+='<td class="sep"></td>'+SIGNALS.map((s,j)=>s.terms.includes(I.id)?`<td class="c ${S.m[m]?'hot':'cold'}" data-pid="L3:or:${m}:${j}">◆</td>`:'<td class="c e"></td>').join('')+'</tr>';
 });
 h+=`<tr><th>S</th><td colspan="12" class="note">● literal del minitérmino (verde = verdadero bajo v)</td><td class="sep"></td>`+SIGNALS.map((s,j)=>`<td class="c ${S.sig[j]?'hot':'cold'}" data-pid="L3:out:${j}">${S.sig[j]}</td>`).join('')+'</tr>';
 h+='</tbody></table></div><p class="mut">Plano AND (izq.) × plano OR (der.). En capa 2, cada ● se realiza con un nMOS en la columna <i>complementaria</i>: conduce cuando el literal es falso (NOR de complementos = AND). Toca una celda para su ficha.</p>';
 const el=$('#tab-pla');el.innerHTML=h;
 el.querySelectorAll('[data-pid]').forEach(td=>td.onclick=()=>select(td.dataset.pid));
}

/* ================= CONTROLES ================= */
function showTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+t));}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('#ib').innerHTML=INSTR.map((I,m)=>`<button class="ib" data-m="${m}"><b>${I.name}</b><span>${I.op.join('')}</span></button>`).join('');
$('#ib').querySelectorAll('button').forEach(b=>b.onclick=()=>setBits(INSTR[+b.dataset.m].op));
$('#bits').innerHTML=[0,1,2,3,4,5].map(i=>`<button data-i="${i}"><small>Op${5-i}</small><span></span></button>`).join('');
$('#bits').querySelectorAll('button').forEach(b=>b.onclick=()=>{const nb=[...S.bits];nb[+b.dataset.i]^=1;setBits(nb);});

let animOn=true,prop=99,gen=0;
function setBits(b){S=compute(b);gen++;prop=animOn?0:99;refreshUI();}
function refreshUI(){
 const hex='0x'+parseInt(S.bits.join(''),2).toString(16).toUpperCase().padStart(2,'0');
 $('#ib').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.m===S.instr));
 $('#bits').querySelectorAll('button').forEach(b=>{const v=S.bits[+b.dataset.i];b.querySelector('span').textContent=v;b.classList.toggle('one',!!v);});
 $('#cur').innerHTML=`opcode <b>${S.bits.join('')}</b> · ${hex} · ${S.instr>=0?`<b>${INSTR[S.instr].name}</b> · ${INSTR[S.instr].ex}`:'<b>no decodificado</b> (vector nulo)'}`;
 $('#hudI').textContent=S.instr>=0?INSTR[S.instr].name:'opcode no implementado';
 $('#hudB').textContent=`Op[5:0] = ${S.bits.join('')} → ${SIGNALS.filter((s,j)=>S.sig[j]).map(s=>s.id).join(', ')||'ninguna señal'}`;
 renderTT();renderPLA();renderInsp();
}

function buildCapas(){
 const ML={visible:'Visible',ghost:'Fantasma',hidden:'Oculta'};
 let h='<h3>Capas</h3>';
 for(const n of [4,3,2,1])h+=`<div class="lrow"><div class="ln"><b>${n}</b> · ${LAY[n].short}</div><div class="seg" data-n="${n}">${Object.keys(ML).map(m=>`<button data-m="${m}">${ML[m]}</button>`).join('')}</div></div>`;
 h+=`<div class="presets"><button data-p="all">Todo visible</button><button data-p="xray">Radiografía</button><button data-p="logic">Sólo álgebra (3)</button><button data-p="phys">Transistores + silicio</button></div>
 <h3>Despiece (eje Y) · <span id="gv">${gap.toFixed(1)}</span></h3><input type="range" id="gap" min="0.9" max="9" step="0.1" value="${gap}">
 <h3>Opciones</h3>
 <label class="ck"><input type="checkbox" id="cL"${showLabels?' checked':''}> Etiquetas</label>
 <label class="ck"><input type="checkbox" id="cA" checked> Animar propagación (IR → AND → OR → salida)</label>
 <label class="ck"><input type="checkbox" id="cR"> Auto-rotación</label>
 <button id="rv">Reiniciar vista</button>
 <h3>Leyenda</h3><div class="lg">
 <div><i style="background:#ffc94a"></i>señal en 1 / V<sub>DD</sub></div><div><i style="background:#ff7a1a"></i>canal conduciendo</div>
 <div><i style="background:#2fd07f"></i>literal satisfecho</div><div><i style="background:#d03a4c"></i>literal que anula</div>
 <div><i style="background:#9b2d24"></i>polisilicio</div><div><i style="background:#2c7d50"></i>difusión n+</div>
 <div><i style="background:#9a6a25"></i>difusión p+</div><div><i style="background:#6e5530"></i>n-well</div>
 <div><i style="background:#3a6fc0"></i>metal 1</div><div><i style="background:#9d97c4"></i>metal 2</div>
 <div><i style="background:#1f7a45"></i>GND</div><div><i style="background:#c23b3b"></i>V<sub>DD</sub></div></div>
 <p class="mut" style="margin-top:10px">Sólo se inspeccionan capas en modo Visible: pon una capa en Fantasma para tocar las de abajo.</p>`;
 const el=$('#tab-cap');el.innerHTML=h;
 el.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(+sg.dataset.n,b.dataset.m)));
 const P={all:{4:'visible',3:'visible',2:'visible',1:'visible'},xray:{4:'ghost',3:'visible',2:'ghost',1:'visible'},logic:{4:'ghost',3:'visible',2:'hidden',1:'hidden'},phys:{4:'hidden',3:'ghost',2:'visible',1:'visible'}};
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=P[b.dataset.p];for(const n in p)setMode(+n,p[n]);});
 $('#gap').oninput=e=>{const ng=+e.target.value,d=(ng-gap)*1.5;gap=ng;controls.target.y+=d;camera.position.y+=d;$('#gv').textContent=ng.toFixed(1);};
 $('#cL').onchange=e=>{showLabels=e.target.checked;refreshLabels();};
 $('#cA').onchange=e=>{animOn=e.target.checked;};
 $('#cR').onchange=e=>{controls.autoRotate=e.target.checked;};
 $('#rv').onclick=resetView;
 syncSeg();
}
function setMode(n,m){LAY[n].mode=m;applyMode(n);syncSeg();}
function syncSeg(){document.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',LAY[+sg.dataset.n].mode===b.dataset.m)));}

/* ================= VISTA / LOOP ================= */
function resetView(){
 controls.target.set(-0.5,gap*1.5,0);
 const f=Math.max(1,1.4/camera.aspect);
 camera.position.set(-0.5+15*f,gap*1.5+17*f,27*f);
 controls.update();
}
function resize(){const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;renderer.setSize(w,h);lr.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(vp);resize();resetView();

buildCapas();refreshUI();

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),0.05);
 gapCur+=(gap-gapCur)*Math.min(1,dt*8);
 for(const n of [1,2,3,4])LAY[n].g.position.y=(n-1)*gapCur;
 if(prop<7)prop+=dt*4.4;
 for(const u of UPD)if(u.g!==gen&&u.stage<=prop){u.fn(S);u.g=gen;}
 controls.update();
 if(selObj&&selBox.visible)selBox.setFromObject(selObj);
 renderer.render(scene,camera);lr.render(scene,camera);
}
loop();
</script>
</body>
</html>
