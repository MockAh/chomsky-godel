# Construye la imagen; no despliega (spec 04 §4).
serviceAccount: projects/$PROJECT_ID/serviceAccounts/sitio-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/sitio/sitio:${_ETIQUETA}", "."]
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/sitio/sitio:${_ETIQUETA}
