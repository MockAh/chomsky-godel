<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chomsky-godel · Crear contraseña</title>
<link rel="icon" href="/estaticos/favicon.svg">
<link rel="stylesheet" href="/estaticos/base.css">
<link rel="stylesheet" href="/estaticos/activar.css">
<script type="module" src="/estaticos/activar.js"></script>
</head>
<body>
<main class="centro">
  <form id="form-activar" class="tarjeta-fija" novalidate>
    <h1>Crea tu contraseña</h1>
    <label class="campo"><span>Contraseña nueva</span>
      <input id="nueva" type="password" autocomplete="new-password" required maxlength="256">
    </label>
    <label class="campo"><span>Repítela</span>
      <input id="repetir" type="password" autocomplete="new-password" required maxlength="256">
    </label>
    <p class="regla">12 caracteres o más, con mayúscula, minúscula, número y símbolo.</p>
    <p id="mensaje" class="mensaje" role="alert"></p>
    <div class="acciones">
      <button type="submit" id="crear" class="boton boton-principal">Crear y entrar</button>
    </div>
  </form>
</main>
</body>
</html>
